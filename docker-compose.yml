services:
  db:
    image: postgres:17-alpine # Use official Postgres image
    container_name: mp_aggregator_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user} # Read from .env or use default
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_db}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_TEST_DB:-marketplace_test_db_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # Expose port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/ # Persist data

volumes:
  postgres_data:
